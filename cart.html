<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | WeTop</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 style="text-align:center; margin-top:30px;">🛒 Your Shopping Cart</h1>

<div id="cartContainer" style="max-width:800px; margin:30px auto; padding:20px;"></div>

<h2 id="totalPrice" style="text-align:center;">Total: ₹0</h2>

<div style="text-align:center; margin-top:20px;">

<button onclick="clearCart()">Clear Cart</button>

<a href="products.html">
<button>Continue Shopping</button>
</a>

</div>

<script src="script.js"></script>

<script>

const cart = getCart();

const container = document.getElementById("cartContainer");

const total = document.getElementById("totalPrice");

let sum = 0;

if(cart.length === 0){

container.innerHTML = "<h2>Your cart is empty 🛒</h2>";

}else{

cart.forEach((item,index)=>{

sum += item.price;

container.innerHTML += `
<div style="border:1px solid #ddd;padding:15px;margin-bottom:15px;border-radius:10px;">
<h3>${item.name}</h3>
<p>Price: ₹${item.price}</p>
<button onclick="removeFromCart(${index})">Remove</button>
</div>
`;

});

}

total.innerHTML = "Total: ₹" + sum;

</script>

</body>
</html>
