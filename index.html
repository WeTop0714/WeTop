<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeTop | Everything You Need</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>WeTop</span>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Contact</a>
    </nav>

    <div class="icons">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-regular fa-heart"></i>
        <i class="fa-solid fa-cart-shopping"></i>
        <i class="fa-regular fa-user"></i>
    </div>

</header>

<section class="hero">

    <div class="hero-text">

        <h1>Everything You Need,<br>All in One Place.</h1>

        <p>
            Shop electronics, fashion, beauty, gaming, home essentials and much more.
        </p>

        <button>Shop Now</button>

    </div>

    <div class="hero-image">
        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=700" alt="Shopping">
    </div>

</section>
<section class="categories">

<h2>Shop by Category</h2>

<div class="category-grid">

<div class="category-card">
📱
<h3>Electronics</h3>
</div>

<div class="category-card">
👕
<h3>Fashion</h3>
</div>

<div class="category-card">
💄
<h3>Beauty</h3>
</div>

<div class="category-card">
🏠
<h3>Home</h3>
</div>

<div class="category-card">
🎮
<h3>Gaming</h3>
</div>

<div class="category-card">
⌚
<h3>Accessories</h3>
</div>

</div>

</section>
<script src="script.js"></script>

</body>
</html>
